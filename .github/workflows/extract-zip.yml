name: Extract zip and replace repo contents

on:
  workflow_dispatch:

jobs:
  extract-and-replace:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract zip and replace repo contents
        shell: bash
        run: |
          set -euo pipefail

          ZIP_PATH="Conect-Prelaunch-Phase13-Paystack-Webhook.zip"

          if [ ! -f "$ZIP_PATH" ]; then
            echo "ZIP not found: $ZIP_PATH"
            exit 1
          fi

          rm -rf /tmp/repo-extract
          mkdir -p /tmp/repo-extract
          unzip -q "$ZIP_PATH" -d /tmp/repo-extract

          shopt -s dotglob nullglob
          source_items=(/tmp/repo-extract/*)

          if [ ${#source_items[@]} -eq 0 ]; then
            echo "Extracted zip is empty"
            exit 1
          fi

          SOURCE_DIR="/tmp/repo-extract"
          if [ ${#source_items[@]} -eq 1 ] && [ -d "${source_items[0]}" ]; then
            SOURCE_DIR="${source_items[0]}"
          fi

          echo "Using source directory: $SOURCE_DIR"

          git ls-files -z | xargs -0 -r rm -f --

          shopt -s dotglob nullglob
          extracted_items=("$SOURCE_DIR"/*)
          for item in "${extracted_items[@]}"; do
            cp -a "$item" .
          done

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: replace repo contents with extracted zip"
          git push origin HEAD:${GITHUB_REF_NAME:-main}
