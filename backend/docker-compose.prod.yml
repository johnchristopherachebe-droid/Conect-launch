# Production stack: API + Postgres + Caddy (automatic HTTPS).
# Run:  docker compose --env-file .env.production -f docker-compose.prod.yml up -d --build
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: conect
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: conect
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U conect"]
      interval: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    env_file: .env.production
    environment:
      DATABASE_URL: postgres://conect:${DB_PASSWORD}@db:5432/conect
    depends_on:
      db: { condition: service_healthy }
    volumes:
      - ./firebase-service-account.json:/app/firebase-service-account.json:ro

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [api]

volumes:
  pgdata:
  caddy_data:
