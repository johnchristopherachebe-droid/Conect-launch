<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cönëct Admin</title>
<style>
:root{color-scheme:light dark;--purple:#7C3AED;--deep:#2A0F55;--lav:#EDE7FB;--accent:#FF7A00;--bg:#F7F5FB;--card:#fff;--text:#1B1030;--line:#E3DBF3;--muted:#6B6280;--brand:var(--purple);--ok:#16A34A;--bad:#DC2626}
@media (prefers-color-scheme:dark){:root{--bg:#110B1E;--card:#1C1430;--text:#F1EDFA;--line:#2E2347;--muted:#A99FC4;--lav:#2A2050}}
*{box-sizing:border-box}
body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;margin:0;background:var(--bg);color:var(--text)}
h1,h2,h3{margin:0 0 8px}h2{font-size:20px}h3{font-size:17px;margin-top:20px}
.top{background:linear-gradient(#0B0615,#3B1480);color:#fff;padding-top:env(safe-area-inset-top)}
.top-in{max-width:1100px;margin:0 auto;padding:14px 16px 6px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.brandrow{display:flex;align-items:center;gap:10px}.brandrow svg{height:34px;width:auto}
.word{font-size:26px;font-weight:800;letter-spacing:-.6px}.word b{color:#A78BFA}
.tag{background:var(--accent);color:#fff;font-size:11px;font-weight:800;letter-spacing:2px;padding:3px 10px;border-radius:99px}
.tabs{max-width:1100px;margin:0 auto;padding:6px 16px 14px;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;background:rgba(255,255,255,.1);color:#E4D9FF;border:0;border-radius:99px;padding:8px 16px;font-weight:600}
.tabs button.on{background:#fff;color:var(--deep)}
main{max-width:1100px;margin:0 auto;padding:18px 16px 40px}
button{font:inherit;padding:8px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);cursor:pointer}
button:hover{border-color:var(--purple)}
button.primary{background:var(--purple);color:#fff;border-color:var(--purple);font-weight:700}
button.ghost{background:rgba(255,255,255,.12);color:#fff;border-color:transparent}
button.link{background:none;border:0;color:var(--purple);padding:4px 0;font-weight:600}
button[data-doc-review][data-status="rejected"]{border-color:var(--bad);color:var(--bad)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #FFD23F;outline-offset:2px}
input,select,textarea{font:inherit;padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);max-width:100%}
textarea{width:100%;resize:vertical}
.scroll{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:16px;margin:12px 0}
table{border-collapse:collapse;width:100%;margin:0}
th{background:var(--lav);color:var(--deep);font-size:12px;text-transform:uppercase;letter-spacing:.5px}
@media (prefers-color-scheme:dark){th{color:#D9CCF5}}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
tr:last-child td{border-bottom:0}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0;align-items:flex-end}
.err{color:var(--bad);min-height:1.2em;margin:0 0 8px}.mute{color:var(--muted)}
hr{border:0;border-top:1px solid var(--line);margin:24px 0}
.pill{padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700;background:var(--lav);color:var(--deep);border:0;display:inline-block}
@media (prefers-color-scheme:dark){.pill{color:#E4D9FF}}
.pill[data-s=placed],.pill[data-s=open]{background:#FFE9D2;color:#9A4A00}
.pill[data-s=preparing],.pill[data-s=ready],.pill[data-s=picked_up],.pill[data-s=in_progress]{background:var(--lav);color:var(--purple)}
.pill[data-s=delivered],.pill[data-s=resolved],.pill[data-s=closed]{background:#DDF5E5;color:#0E6B31}
.pill[data-s=cancelled],.pill[data-s=escalated]{background:#FDE0E0;color:#A11}
.login{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:24px;background:linear-gradient(#0B0615,#3B1480)}
.login .brandrow{flex-direction:column;gap:8px;color:#fff}.login .brandrow svg{height:78px}.login .word{font-size:40px}
.login-card{background:var(--card);color:var(--text);border-radius:24px;padding:26px;width:100%;max-width:400px;display:flex;flex-direction:column;gap:12px}
.login-card button{padding:13px}
.stats{display:flex;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.stat{flex:1;min-width:130px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.stat b{display:block;font-size:26px;color:var(--purple)}.stat span{color:var(--muted);font-size:13px}
.ticket{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:10px;cursor:pointer}
.ticket:hover{border-color:var(--purple)}
.ticket-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.ticket-top b{font-size:16px}.ticket p{margin:6px 0 0;color:var(--muted);overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.ticket small{display:block;margin-top:6px;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0}
.thread{display:flex;flex-direction:column;gap:8px;margin:12px 0;max-height:55vh;overflow-y:auto;padding:4px}
.bubble{max-width:min(520px,85%);padding:10px 14px;border-radius:16px;background:var(--lav);color:var(--deep);align-self:flex-start}
@media (prefers-color-scheme:dark){.bubble{color:#EDE7FB}}
.bubble.staff{background:var(--purple);color:#fff;align-self:flex-end}
.bubble small{display:block;opacity:.75;font-weight:700;margin-bottom:2px;font-size:12px}
.bubble div{white-space:pre-wrap;word-break:break-word}
.composer{display:flex;flex-direction:column;gap:8px}
</style></head><body>
<div id="root"></div>
<script>
const $ = (s) => document.querySelector(s);
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const naira = (v) => '₦' + Number(v).toLocaleString('en-NG', { maximumFractionDigits: 2 });
let token = sessionStorage.getItem('token'), currentRole = sessionStorage.getItem('role') || 'admin', tab = 'orders', err = '', timer = null, openStore = null;

async function api(method, path, body) {
  const r = await fetch(path, { method, headers: { 'Content-Type': 'application/json', ...(token ? { Authorization: 'Bearer ' + token } : {}) }, body: body ? JSON.stringify(body) : undefined });
  const d = r.status === 204 ? null : await r.json().catch(() => ({}));
  if (r.status === 401) { signOut(); throw new Error('Please sign in again'); }
  if (!r.ok) throw new Error(d.error || (d.details || []).join(', ') || 'Something went wrong');
  return d;
}
function signOut() { token = null; sessionStorage.removeItem('token'); sessionStorage.removeItem('role'); clearInterval(timer); render(); }
async function run(fn) { try { err = ''; await fn(); } catch (e) { err = e.message; } show(); }

function render() { token ? shell() : loginView(); }

const LOGO = `<svg viewBox="0 0 200 140" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs><linearGradient id="lg1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7C3AED"/><stop offset="1" stop-color="#A177FF"/></linearGradient><linearGradient id="lg2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E4D9FF"/><stop offset="1" stop-color="#A177FF"/></linearGradient></defs><g fill="#A177FF"><rect x="12" y="52" width="28" height="6" rx="3"/><rect x="6" y="64" width="34" height="6" rx="3"/><rect x="14" y="76" width="26" height="6" rx="3"/><rect x="20" y="88" width="20" height="6" rx="3"/><circle cx="4" cy="66" r="3.5"/></g><circle cx="10" cy="96" r="4" fill="#7C3AED"/><path d="M121.06 102.48A38 38 0 1 1 121.06 53.52" fill="none" stroke="url(#lg1)" stroke-width="22" stroke-linecap="round"/><path d="M160 107.9A34 34 0 1 1 160 64.1" fill="none" stroke="url(#lg2)" stroke-width="20" stroke-linecap="round"/><line x1="94" y1="100" x2="150" y2="52" stroke="url(#lg2)" stroke-width="16" stroke-linecap="round"/><path d="M135 44L127 26A10 10 0 1 1 143 26Z" fill="#7C3AED"/><circle cx="135" cy="20" r="4" fill="#1A0B3A"/></svg>`;
const WORD = '<span class="word">c<b>ö</b>nëct</span>';

function loginView() {
  $('#root').innerHTML = `<div class="login"><div class="brandrow">${LOGO}${WORD}<span class="tag">ADMIN &amp; SUPPORT</span></div>
  <div class="login-card"><h2>Sign in</h2><p class="mute" style="margin:0">Admin and support staff only.</p>
  <input id="em" type="email" placeholder="Email" aria-label="Email" autocomplete="username"><input id="pw" type="password" placeholder="Password" aria-label="Password" autocomplete="current-password">
  <button class="primary" id="go">Sign in</button><p class="err" id="e"></p></div></div>`;
  const go = async () => {
    try {
      const d = await api('POST', '/auth/login', { email: $('#em').value.trim(), password: $('#pw').value });
      if (!['admin','support'].includes(d.user.role)) throw new Error('This account is not an admin or support agent');
      token = d.token; currentRole = d.user.role; sessionStorage.setItem('token', token); sessionStorage.setItem('role', currentRole); render();
    } catch (e) { $('#e').textContent = e.message; token = null; }
  };
  $('#go').onclick = go;
  $('#pw').onkeydown = (ev) => { if (ev.key === 'Enter') go(); };
}

function shell() {
  const tabs = currentRole === 'support' ? ['support'] : ['orders','stores','couriers','vendors','documents','zones','settings','support'];
  $('#root').innerHTML = `<div class="top"><div class="top-in"><div class="brandrow">${LOGO}${WORD}<span class="tag">${currentRole === 'support' ? 'SUPPORT' : 'ADMIN'}</span></div><button id="out" class="ghost">Sign out</button></div>
  <nav class="tabs">${tabs.map((t) => `<button data-t="${t}" class="${t === tab ? 'on' : ''}">${t[0].toUpperCase() + t.slice(1)}</button>`).join('')}</nav></div>
  <main><p class="err" id="e"></p><div id="view"></div></main>`;
  $('#out').onclick = signOut;
  document.querySelectorAll('nav [data-t]').forEach((b) => b.onclick = () => { tab = b.dataset.t; openTicket = null; clearInterval(timer); shell(); });
  show();
}

async function show() {
  if (!token) return;
  const e = $('#e'); if (e) e.textContent = err;
  try {
    if (tab === 'orders' && currentRole === 'admin') await ordersView();
    else if (tab === 'stores' && currentRole === 'admin') await storesView();
    else if (tab === 'couriers' && currentRole === 'admin') await couriersView();
    else if (tab === 'vendors' && currentRole === 'admin') await vendorsView();
    else if (tab === 'documents' && currentRole === 'admin') await documentsView();
    else if (tab === 'zones' && currentRole === 'admin') await zonesView();
    else if (tab === 'settings' && currentRole === 'admin') await settingsView();
    else await supportView();
  } catch (x) { if ($('#e')) $('#e').textContent = x.message; }
  decorate();
}
function decorate() { document.querySelectorAll('.pill').forEach((p) => { p.dataset.s = p.textContent.trim(); }); }

let statusFilter = '';
async function ordersView() {
  const rows = await api('GET', '/admin/orders' + (statusFilter ? '?status=' + statusFilter : ''));
  $('#view').innerHTML = `<div class="row"><label>Status <select id="sf"><option value="">All</option>${['placed','preparing','ready','picked_up','delivered','cancelled'].map((s) => `<option ${s === statusFilter ? 'selected' : ''}>${s}</option>`).join('')}</select></label></div>
  <div class="scroll"><table><tr><th>Time</th><th>Store</th><th>Customer</th><th>Courier</th><th>Total</th><th>Paid</th><th>Status</th><th>Refund</th><th>Actions</th></tr>
  ${rows.map((o) => `<tr><td>${esc(new Date(o.created_at).toLocaleString())}</td><td>${esc(o.store_name)}</td><td>${esc(o.customer_name)}</td><td>${esc(o.courier_name || '-')}</td><td>${naira(o.total)}</td><td>${o.paid ? 'Yes' : 'No'}</td><td><span class="pill">${esc(o.status)}</span></td><td>${esc(o.refund_status || 'none')}</td>
  <td>${['delivered','cancelled'].includes(o.status) ? '' : `<button data-c="${esc(o.id)}">Cancel</button>`} ${o.paid ? `<button data-refund-status="${esc(o.id)}" data-rs="${esc(o.refund_status || 'none')}">Update refund</button>` : ''}</td></tr>`).join('') || '<tr><td colspan="9" class="mute">No orders yet.</td></tr>'}</table></div>`;
  $('#sf').onchange = (ev) => { statusFilter = ev.target.value; show(); };
  document.querySelectorAll('[data-c]').forEach((b) => b.onclick = () => {
    if (!confirm('Cancel this order? Paid orders are refunded.')) return;
    run(async () => { const r = await api('POST', `/admin/orders/${b.dataset.c}/cancel`); if (r.refund === 'failed') throw new Error('Cancelled, but the refund failed. Refund it in the Paystack dashboard.'); });
  });
  document.querySelectorAll('[data-refund-status]').forEach((b) => b.onclick = () => {
    const status = prompt('Refund status: requested, processing, completed, failed, rejected. Only choose completed after confirming settlement in Paystack.', b.dataset.rs === 'none' ? 'requested' : b.dataset.rs);
    if (status === null) return;
    const note = prompt(status === 'completed' ? 'Required: explain how you confirmed the refund in Paystack.' : 'Refund reconciliation note (optional)', '') ?? '';
    if (status === 'completed' && !note.trim()) { alert('A reconciliation note is required before marking a refund completed.'); return; }
    const provider_reference = status === 'completed' ? prompt('Enter the Paystack refund reference shown in the dashboard:') : undefined;
    if (status === 'completed' && !provider_reference?.trim()) { alert('A Paystack refund reference is required.'); return; }
    run(() => api('PATCH', `/admin/orders/${b.dataset.refundStatus}/refund-status`, { status, note, ...(provider_reference ? { provider_reference } : {}) }));
  });
  clearInterval(timer); timer = setInterval(() => { if (tab === 'orders') show(); }, 10000);
}

async function storesView() {
  const stores = await api('GET', '/admin/stores');
  let products = [];
  if (openStore) products = await api('GET', `/admin/stores/${openStore}/products`);
  const cur = stores.find((s) => s.id === openStore);
  $('#view').innerHTML = `<div class="scroll"><table><tr><th>Store</th><th>Category</th><th>ETA</th><th>Delivery fee</th><th>Map location</th><th>Open</th><th></th></tr>
  ${stores.map((s) => `<tr><td>${esc(s.emoji)} ${esc(s.name)}</td><td>${esc(s.category)}</td><td>${s.eta_minutes} min</td><td>${naira(s.delivery_fee)}</td><td>${s.lat != null ? esc(Number(s.lat).toFixed(4) + ', ' + Number(s.lng).toFixed(4)) : '<span class="mute">Not set</span>'} <button data-loc="${s.id}">Set</button></td>
  <td><input type="checkbox" data-open="${s.id}" ${s.is_open ? 'checked' : ''} aria-label="Open ${esc(s.name)}"></td><td><button data-menu="${s.id}">Menu (${s.product_count})</button></td></tr>`).join('')}</table></div>
  <h3>Add a store</h3><div class="row"><input id="sn" placeholder="Name"><select id="sc">${['food','groceries','pharmacy','courier'].map((c) => `<option>${c}</option>`).join('')}</select>
  <input id="se" placeholder="Emoji" size="3"><input id="st" type="number" placeholder="ETA (min)" style="width:110px"><input id="sf2" type="number" placeholder="Fee (₦)" style="width:110px"><input id="sla" type="number" step="any" placeholder="Latitude" style="width:110px"><input id="slo" type="number" step="any" placeholder="Longitude" style="width:110px"><button class="primary" id="sa">Add store</button></div>
  ${cur ? `<h3>${esc(cur.name)} menu</h3><div class="scroll"><table><tr><th>Item</th><th>Price</th><th>Available</th><th></th></tr>
  ${products.map((p) => `<tr><td>${esc(p.name)}</td><td>${naira(p.price)}</td><td><input type="checkbox" data-av="${p.id}" ${p.available ? 'checked' : ''} aria-label="Available ${esc(p.name)}"></td><td><button data-price="${p.id}" data-p="${esc(p.price)}">Change price</button></td></tr>`).join('') || '<tr><td colspan="4" class="mute">No items yet.</td></tr>'}</table></div>
  <div class="row"><input id="pn" placeholder="Item name"><input id="pp" type="number" placeholder="Price (₦)" style="width:120px"><button class="primary" id="pa">Add item</button></div>` : '<p class="mute">Choose a store’s menu to edit its items.</p>'}`;
  document.querySelectorAll('[data-open]').forEach((c) => c.onchange = () => run(() => api('PATCH', `/admin/stores/${c.dataset.open}`, { is_open: c.checked })));
  document.querySelectorAll('[data-loc]').forEach((b) => b.onclick = () => {
    const v = prompt('Store location as "latitude, longitude" (copy it from a map app)', '');
    if (v === null) return;
    const [lat, lng] = v.split(',').map((x) => Number(x.trim()));
    if (!Number.isFinite(lat) || !Number.isFinite(lng)) { err = 'Enter two numbers, like 6.4281, 3.4219'; return show(); }
    run(() => api('PATCH', `/admin/stores/${b.dataset.loc}`, { lat, lng }));
  });
  document.querySelectorAll('[data-menu]').forEach((b) => b.onclick = () => { openStore = +b.dataset.menu; show(); });
  $('#sa').onclick = () => run(async () => {
    const b = { name: $('#sn').value.trim(), category: $('#sc').value };
    if ($('#se').value) b.emoji = $('#se').value; if ($('#st').value) b.eta_minutes = +$('#st').value; if ($('#sf2').value) b.delivery_fee = +$('#sf2').value;
    if ($('#sla').value && $('#slo').value) { b.lat = +$('#sla').value; b.lng = +$('#slo').value; }
    await api('POST', '/admin/stores', b);
  });
  document.querySelectorAll('[data-av]').forEach((c) => c.onchange = () => run(() => api('PATCH', `/admin/products/${c.dataset.av}`, { available: c.checked })));
  document.querySelectorAll('[data-price]').forEach((b) => b.onclick = () => {
    const v = prompt('New price in naira', b.dataset.p); if (v === null) return;
    run(() => api('PATCH', `/admin/products/${b.dataset.price}`, { price: Number(v) }));
  });
  const pa = $('#pa'); if (pa) pa.onclick = () => run(() => api('POST', `/admin/stores/${openStore}/products`, { name: $('#pn').value.trim(), price: Number($('#pp').value) }));
}

async function couriersView() {
  const rows = await api('GET', '/admin/couriers');
  $('#view').innerHTML = `<p class="mute">Couriers cannot receive jobs until their profile, ID, driving licence, applicable vehicle registration and in-person orientation are approved. Review actual files in Documents.</p><div class="scroll"><table><tr><th>Name</th><th>Email</th><th>Phone</th><th>Vehicle</th><th>ID</th><th>Licence</th><th>Vehicle reg.</th><th>Orientation</th><th>Approval</th><th>Jobs</th><th>Action</th></tr>
  ${rows.map((c) => `<tr><td>${esc(c.name)}</td><td>${esc(c.email)}</td><td>${esc(c.phone || '-')}</td><td>${esc(c.vehicle_type || 'Profile missing')}</td><td>${esc(c.government_id_status || 'not submitted')}</td><td>${esc(c.driving_license_status || 'not submitted')}</td><td>${esc(c.vehicle_registration_status || 'not submitted')}</td><td>${c.orientation_completed ? 'Complete' : 'Pending'}</td><td>${c.courier_approved ? 'Approved' : 'Pending'}</td><td>${c.active_orders} active / ${c.delivered} delivered</td><td><button data-approve="${esc(c.id)}" data-value="${!c.courier_approved}">${c.courier_approved ? 'Suspend' : 'Review / approve'}</button></td></tr>`).join('') || '<tr><td colspan="11" class="mute">No couriers have signed up yet.</td></tr>'}</table></div>`;
  document.querySelectorAll('[data-approve]').forEach((b) => b.onclick = () => {
    const approve = b.dataset.value === 'true';
    let body = { approved: approve };
    if (approve) {
      body.orientation_completed = confirm('Confirm the required in-person orientation has been completed. Choose Cancel if it has not.');
      if (body.orientation_completed) body.orientation_notes = prompt('Orientation date and topics covered', '') ?? '';
      body.review_notes = prompt('Internal courier review notes (optional)', '') ?? '';
    }
    run(() => api('PATCH', `/admin/couriers/${b.dataset.approve}/approval`, body));
  });
}
async function vendorsView() {
  const rows = await api('GET', '/admin/vendors');
  $('#view').innerHTML = `<p class="mute">Approve vendors only after reviewing their actual submitted files in Documents and completing required in-person orientation. Document status cannot be manually overridden here.</p><div class="scroll"><table><tr><th>Business</th><th>Owner</th><th>Type</th><th>ID</th><th>Food safety</th><th>Orientation</th><th>Approval</th><th>Review</th></tr>
  ${rows.map((v) => `<tr><td>${esc(v.business_name || 'Profile missing')}</td><td>${esc(v.name)}<br>${esc(v.email)}</td><td>${esc(v.business_type || '-')}</td><td>${esc(v.government_id_status || 'not submitted')}</td><td>${esc(v.food_safety_status || 'not submitted')}</td><td>${v.orientation_completed ? 'Complete' : 'Pending'}</td><td>${v.vendor_approved ? 'Approved' : 'Pending'}</td><td><button data-review="${esc(v.id)}">Review / approve</button></td></tr>`).join('') || '<tr><td colspan="8" class="mute">No vendor applications yet.</td></tr>'}</table></div>`;
  document.querySelectorAll('[data-review]').forEach((b) => b.onclick = () => {
    const id = b.dataset.review, row = rows.find((v) => v.id === id);
    const orientation = confirm('Confirm that the required in-person orientation is complete?');
    const orientationNotes = orientation ? (prompt('Orientation date and topics covered', row.orientation_notes || '') ?? '') : '';
    const notes = prompt('Internal review notes (optional)', row.review_notes || '') ?? '';
    const approve = confirm('Approve this vendor now? The server verifies uploaded document review statuses and orientation.');
    run(async () => { await api('PATCH', `/admin/vendors/${id}/approval`, { approved: approve, orientation_completed: orientation, orientation_notes: orientationNotes, review_notes: notes }); await show(); });
  });
}
async function documentsView() {
  const rows = await api('GET','/admin/documents');
  $('#view').innerHTML = `<h2>Private verification documents</h2><p class="mute">Files are encrypted in the database and available only to admins. Approving a file updates the applicant’s document status. Review files carefully and never download them to a shared device.</p><div class="scroll"><table><tr><th>Submitted</th><th>Applicant</th><th>Role</th><th>Document</th><th>File</th><th>Status</th><th>Notes</th><th>Actions</th></tr>
  ${rows.map((d)=>`<tr><td>${esc(new Date(d.created_at).toLocaleString())}</td><td>${esc(d.owner_name)}<br>${esc(d.owner_email)}</td><td>${esc(d.owner_role)}</td><td>${esc(d.document_type.replaceAll('_',' '))}</td><td>${esc(d.filename)}<br><button data-file="${d.id}" data-filename="${esc(d.filename)}">Download for review</button></td><td>${esc(d.review_status)}</td><td>${esc(d.review_notes || '-')}</td><td><button data-doc-review="${d.id}" data-status="approved">Approve</button> <button data-doc-review="${d.id}" data-status="rejected">Reject</button></td></tr>`).join('') || '<tr><td colspan="8" class="mute">No documents submitted yet.</td></tr>'}</table></div>`;
  document.querySelectorAll('[data-file]').forEach((b)=>b.onclick=()=>run(async()=>{
    const r=await fetch(`/admin/documents/${b.dataset.file}/file`,{headers:{Authorization:'Bearer '+token}});
    if(!r.ok){const d=await r.json().catch(()=>({}));throw new Error(d.error||'Could not download document');}
    const url=URL.createObjectURL(await r.blob());const a=document.createElement('a');a.href=url;a.download=b.dataset.filename||'verification-document';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);
  }));
  document.querySelectorAll('[data-doc-review]').forEach((b)=>b.onclick=()=>run(async()=>{
    const notes=prompt(`Review notes for ${b.dataset.status} (optional)`, '') ?? '';
    await api('PATCH',`/admin/documents/${b.dataset.docReview}`,{review_status:b.dataset.status,review_notes:notes});
    await documentsView();
  }));
}
async function zonesView() {
  const rows = await api('GET','/admin/delivery-zones');
  $('#view').innerHTML = `<h2>No-delivery zones</h2><p class="mute">Addresses inside an enabled circular zone will be blocked at quote and checkout. Use map coordinates for the zone centre.</p>
  <div class="scroll"><table><tr><th>Name</th><th>Centre latitude</th><th>Centre longitude</th><th>Radius (km)</th><th>Enabled</th><th></th></tr>
  ${rows.map((z)=>`<tr><td>${esc(z.name)}</td><td>${Number(z.center_lat).toFixed(5)}</td><td>${Number(z.center_lng).toFixed(5)}</td><td>${Number(z.radius_km).toFixed(2)}</td><td><input type="checkbox" data-zone-toggle="${z.id}" ${z.enabled?'checked':''} aria-label="Enable ${esc(z.name)}"></td><td><button data-zone-delete="${z.id}">Delete</button></td></tr>`).join('') || '<tr><td colspan="6" class="mute">No zones configured.</td></tr>'}</table></div>
  <h3>Add a no-delivery zone</h3><div class="row"><input id="zn" placeholder="Zone name" aria-label="Zone name"><input id="zlat" type="number" step="any" placeholder="Centre latitude" aria-label="Centre latitude"><input id="zlng" type="number" step="any" placeholder="Centre longitude" aria-label="Centre longitude"><input id="zrad" type="number" step="any" min="0.1" max="500" placeholder="Radius km" aria-label="Radius km"><button class="primary" id="za">Add zone</button></div>`;
  document.querySelectorAll('[data-zone-toggle]').forEach((el)=>el.onchange=()=>run(async()=>{await api('PATCH',`/admin/delivery-zones/${el.dataset.zoneToggle}`,{enabled:el.checked});await zonesView();}));
  document.querySelectorAll('[data-zone-delete]').forEach((el)=>el.onclick=()=>{if(confirm('Delete this no-delivery zone?'))run(async()=>{await api('DELETE',`/admin/delivery-zones/${el.dataset.zoneDelete}`);await zonesView();});});
  $('#za').onclick=()=>run(async()=>{await api('POST','/admin/delivery-zones',{name:$('#zn').value.trim(),center_lat:Number($('#zlat').value),center_lng:Number($('#zlng').value),radius_km:Number($('#zrad').value),enabled:true});await zonesView();});
}

async function settingsView() {
  const s=await api('GET','/admin/settings');
  $('#view').innerHTML=`<h2>Delivery pricing</h2><p class="mute">These settings apply to future delivery quotes and orders. Prices are in naira (NGN). Existing orders keep their recorded fee.</p>
  <div class="row"><label>Base fee (₦)<br><input id="dbase" type="number" min="0" step="1" value="${esc(s.delivery_base_fee?.value ?? 300)}"></label><label>Per kilometre (₦)<br><input id="dper" type="number" min="0" step="1" value="${esc(s.delivery_per_km?.value ?? 180)}"></label><label>Minimum fee (₦)<br><input id="dmin" type="number" min="0" step="1" value="${esc(s.delivery_min_fee?.value ?? 300)}"></label></div>
  <button class="primary" id="savefees">Save delivery pricing</button>
  <hr><h2>Vendor commission</h2><p class="mute">Default is 10% of the food subtotal only. Delivery fees are excluded. Changes apply to new orders only; existing orders keep their saved rate and amounts.</p>
  <div class="row"><label>Commission (%)<br><input id="commission" type="number" min="0" max="50" step="0.5" value="${esc(s.vendor_commission_percent?.value ?? 10)}"></label></div><button class="primary" id="savecommission">Save commission</button>`;
  $('#savefees').onclick=()=>run(async()=>{const result=await api('PATCH','/admin/settings/delivery-fees',{base_fee:Number($('#dbase').value),per_km:Number($('#dper').value),min_fee:Number($('#dmin').value)});alert(`Saved: base ₦${result.base_fee}, ₦${result.per_km}/km, minimum ₦${result.min_fee}.`);await settingsView();});
  $('#savecommission').onclick=()=>run(async()=>{const result=await api('PATCH','/admin/settings/commission',{commission_percent:Number($('#commission').value)});alert(`Vendor commission saved at ${result.commission_percent}%. It applies to the food subtotal on new orders.`);await settingsView();});
}

let openTicket = null;
const TICKET_STATUSES = ['open','in_progress','escalated','resolved','closed'];
const ticketsPath = () => currentRole === 'admin' ? '/admin/support/tickets' : '/support/tickets';

async function supportView() {
  if (openTicket) return ticketThread();
  const rows = await api('GET', ticketsPath());
  const active = rows.filter((t) => !['resolved','closed'].includes(t.status)).length;
  const escalated = rows.filter((t) => t.status === 'escalated').length;
  $('#view').innerHTML = `<div class="stats"><div class="stat"><b>${active}</b><span>Need attention</span></div><div class="stat"><b>${escalated}</b><span>Escalated</span></div><div class="stat"><b>${rows.length}</b><span>All tickets</span></div></div>
  ${rows.map((t) => `<div class="ticket" data-open-ticket="${esc(t.id)}"><div class="ticket-top"><b>${esc(t.subject)}</b><span class="pill">${esc(t.status)}</span></div>
  <p>${esc(t.message)}</p><small>${esc(t.customer_name)} · ${esc(t.customer_email)} · ${esc(new Date(t.created_at).toLocaleString())}${t.order_id ? ' · Order ' + esc(String(t.order_id).slice(0, 8).toUpperCase()) : ''}${t.refund_status && t.refund_status !== 'none' ? ' · Refund: ' + esc(t.refund_status) : ''}</small></div>`).join('') || '<p class="mute">No support tickets yet.</p>'}`;
  document.querySelectorAll('[data-open-ticket]').forEach((el) => el.onclick = () => {
    openTicket = rows.find((t) => String(t.id) === el.dataset.openTicket);
    clearInterval(timer); show();
  });
  clearInterval(timer); timer = setInterval(() => { if (tab === 'support' && !openTicket) show(); }, 10000);
}

function bubbles(t, msgs) {
  const first = `<div class="bubble"><small>${esc(t.customer_name)} (customer)</small><div>${esc(t.message)}</div></div>`;
  return first + msgs.map((m) => `<div class="bubble ${m.author_role === 'customer' ? '' : 'staff'}"><small>${esc(m.author_name)} (${esc(m.author_role)})</small><div>${esc(m.message)}</div></div>`).join('');
}

async function refreshThread() {
  const t = openTicket; if (!t) return;
  const box = $('#th'); if (!box) return;
  const msgs = await api('GET', `/support/tickets/${t.id}/messages`);
  const nearBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 80;
  box.innerHTML = bubbles(t, msgs);
  if (nearBottom) box.scrollTop = box.scrollHeight;
}

async function reloadTicket() {
  const rows = await api('GET', ticketsPath());
  const fresh = rows.find((x) => String(x.id) === String(openTicket.id));
  if (fresh) openTicket = fresh;
}

async function ticketThread() {
  const t = openTicket;
  const msgs = await api('GET', `/support/tickets/${t.id}/messages`);
  const canRefund = currentRole === 'admin' && t.order_id && !['requested','completed','processing'].includes(t.refund_status);
  $('#view').innerHTML = `<button class="link" id="back">← All tickets</button>
  <div class="card"><div class="ticket-top"><h2>${esc(t.subject)}</h2><span class="pill">${esc(t.status)}</span></div>
  <div class="mute">${esc(t.customer_name)} · ${esc(t.customer_email)} · ${esc(new Date(t.created_at).toLocaleString())}</div>
  ${t.order_id ? `<div class="mute">Order ${esc(t.order_id)}</div>` : ''}${t.refund_status && t.refund_status !== 'none' ? `<div class="mute">Refund: ${esc(t.refund_status)}</div>` : ''}
  <div class="row"><label>Status<br><select id="ts">${TICKET_STATUSES.map((s) => `<option ${s === t.status ? 'selected' : ''}>${s}</option>`).join('')}</select></label>
  <label style="flex:1;min-width:200px">Internal note<br><input id="tn" style="width:100%" placeholder="Visible to staff only" value="${esc(t.admin_note || '')}"></label>
  <button id="tsave">Save</button>${canRefund ? '<button id="trefund">Request refund</button>' : ''}</div></div>
  <div class="thread" id="th">${bubbles(t, msgs)}</div>
  <div class="composer"><textarea id="rp" rows="3" placeholder="Reply to the customer"></textarea><button class="primary" id="rsend">Send reply</button></div>`;
  const box = $('#th'); box.scrollTop = box.scrollHeight;
  $('#back').onclick = () => { openTicket = null; clearInterval(timer); show(); };
  $('#tsave').onclick = () => run(async () => {
    const status = $('#ts').value, admin_note = $('#tn').value;
    await api('PATCH', currentRole === 'admin' ? `/admin/support/tickets/${t.id}` : `/support/tickets/${t.id}/status`, { status, admin_note });
    await reloadTicket();
  });
  $('#rsend').onclick = () => run(async () => {
    const message = $('#rp').value.trim(); if (!message) return;
    await api('POST', `/support/tickets/${t.id}/messages`, { message });
    await reloadTicket();
  });
  const rf = $('#trefund');
  if (rf) rf.onclick = () => {
    if (!confirm('Send a refund request to Paystack for this ticket’s verified paid order?')) return;
    run(async () => { await api('POST', `/admin/support/tickets/${t.id}/refund`); await reloadTicket(); });
  };
  clearInterval(timer);
  timer = setInterval(() => { if (tab === 'support' && openTicket) refreshThread().catch(() => {}); }, 8000);
}

render();
</script></body></html>
