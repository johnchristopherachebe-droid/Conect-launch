# Render Blueprint — deploys the whole app (frontend + backend + database) as one
# free stack in a single click: https://dashboard.render.com/blueprints
#
# In the Render dashboard: New + -> Blueprint -> connect this repo -> Apply.
# Render will create the free web service below AND the free Postgres database,
# and wire DATABASE_URL between them automatically. You'll still need to fill in
# the envVars marked "sync: false" (Paystack, SMTP, Termii, VAPID keys) after the
# first deploy, plus PUBLIC_API_URL/PUBLIC_APP_URL once Render assigns your
# service's *.onrender.com URL (see README.md).

services:
  - type: web
    name: conect
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /api/_healthcheck
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: conect-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: STORAGE_DIR
        value: ./storage
      - key: PUBLIC_API_URL
        sync: false # set to this service's https://xxxx.onrender.com URL after first deploy
      - key: PUBLIC_APP_URL
        sync: false # same value as PUBLIC_API_URL
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: TERMII_API_KEY
        sync: false
      - key: TERMII_SENDER_ID
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false

databases:
  - name: conect-db
    plan: free
